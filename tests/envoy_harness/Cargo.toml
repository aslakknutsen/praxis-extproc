[package]
name = "envoy-harness"
version = "0.1.0"
edition = "2024"
publish = false
description = "Local Envoy e2e test harness for praxis-extproc"

[dependencies]
bytes = "1.11.1"
http = "1.4.0"
http-body-util = "0.1.3"
hyper = { version = "1.9.0", features = ["server", "http1", "client"] }
hyper-util = { version = "0.1.20", features = ["tokio", "client-legacy", "http1"] }
praxis-ai-filters = { git = "https://github.com/praxis-proxy/ai.git", rev = "1dc6aebe086ab5bd324234541c11ce6b1b456ae3" }
praxis-extproc = { path = "../.." }
praxis-proto = { path = "../../proto", package = "praxis-proxy-proto" }
reqwest = { version = "0.12.28", default-features = false, features = ["rustls-tls"] }
serde_yaml = { package = "yaml_serde", version = "0.10.4" }
tempfile = "3.20.0"
tokio = { version = "1.52.2", features = ["macros", "rt-multi-thread", "net", "process", "io-util", "time", "sync", "fs"] }
tokio-stream = "0.1.17"
tonic = { version = "0.14.6", features = ["transport"] }
tracing = "0.1.44"

[lints.rust]
missing_docs = "allow"

[lints.clippy]
all = "allow"
